# Hellofedge : tests à chaque push, puis sur `main` l'image et le déploiement (spec 0001).
#
# Secrets GitHub à créer (Settings > Secrets and variables > Actions), détail dans deploy/VPS.md :
#   VPS_HOST, VPS_KNOWN_HOSTS, VPS_SSH_KEY          accès SSH de l'utilisateur `deploy`
#   POSTGRES_PASSWORD, HELLOFEDGE_DOMAIN             base et domaine
#   CTRADER_CLIENT_ID, CTRADER_CLIENT_SECRET,
#   CTRADER_ACCOUNT_ID, CTRADER_ACCESS_TOKEN,
#   CTRADER_REFRESH_TOKEN                            source de prix (après validation par Spotware)
# Le déploiement ne part que si VPS_HOST existe : sans VPS, seuls les tests tournent.

name: ci-deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests (vraie base PostgreSQL, rien n'est sauté)
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [image]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
        if: env.VPS_HOST != ''
      - name: Pas de VPS configuré
        if: env.VPS_HOST == ''
        run: echo "::notice::VPS_HOST absent, déploiement sauté (voir deploy/VPS.md)."
      - name: Clé SSH et hôte connu
        if: env.VPS_HOST != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Copier les fichiers de déploiement
        if: env.VPS_HOST != ''
        run: |
          scp -i ~/.ssh/id_deploy deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh \
            "deploy@$VPS_HOST:/opt/hellofedge/"
          scp -i ~/.ssh/id_deploy exemples/reference_oanda.csv \
            "deploy@$VPS_HOST:/opt/hellofedge/exemples/"
      - name: Écrire le fichier .env depuis les secrets (droits 600)
        if: env.VPS_HOST != ''
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HELLOFEDGE_DOMAIN: ${{ secrets.HELLOFEDGE_DOMAIN }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
        run: |
          {
            echo "IMAGE_TAG=${GITHUB_SHA}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "HELLOFEDGE_DOMAIN=${HELLOFEDGE_DOMAIN}"
            echo "PRICE_SOURCE=ctrader_icmarkets"
            echo "CTRADER_ENV=demo"
            echo "CTRADER_SYMBOL=USDJPY"
            echo "CTRADER_CLIENT_ID=${CTRADER_CLIENT_ID}"
            echo "CTRADER_CLIENT_SECRET=${CTRADER_CLIENT_SECRET}"
            echo "CTRADER_ACCOUNT_ID=${CTRADER_ACCOUNT_ID}"
            echo "CTRADER_ACCESS_TOKEN=${CTRADER_ACCESS_TOKEN}"
            echo "CTRADER_REFRESH_TOKEN=${CTRADER_REFRESH_TOKEN}"
          } | ssh -i ~/.ssh/id_deploy "deploy@$VPS_HOST" \
            'umask 077 && cat > /opt/hellofedge/.env.new && mv /opt/hellofedge/.env.new /opt/hellofedge/.env'
      - name: Migrer puis lancer la nouvelle version
        if: env.VPS_HOST != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "deploy@$VPS_HOST" "
            set -e
            cd /opt/hellofedge
            chmod +x backup.sh
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull
            docker logout ghcr.io
            docker compose run --rm migrate
            docker compose up -d --remove-orphans
            docker image prune -f
          "
      - name: Vérifier que le site répond
        if: env.VPS_HOST != ''
        env:
          HELLOFEDGE_DOMAIN: ${{ secrets.HELLOFEDGE_DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${HELLOFEDGE_DOMAIN}/api/health"; then exit 0; fi
            sleep 5
          done
          echo "::error::/api/health ne répond pas après le déploiement"
          exit 1
